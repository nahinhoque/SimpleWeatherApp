<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Simple Weather App</title>
</head>

<body
    class="min-h-screen bg-gradient-to-tr from-slate-950 via-slate-900 to-sky-950 text-white flex items-center justify-center p-4 antialiased selection:bg-sky-500/30">

    <main
        class="w-full max-w-md rounded-3xl bg-slate-900/40 backdrop-blur-xl border border-white/10 p-8 shadow-2xl transition-all duration-300 hover:border-white/15">

        <header class="text-center space-y-2">
            <h1
                class="text-3xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-sky-300 bg-clip-text text-transparent">
                Simple Weather App
            </h1>
            <p class="text-sm text-slate-400 font-medium max-w-[280px] mx-auto">
                Enter your city and country to discover real-time forecasts
            </p>
        </header>

        <form id="weatherForm" class="mt-8 space-y-5">

            <div class="space-y-2">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400" for="countrySelect">
                    Country
                </label>
                <select id="countrySelect" required
                    class="w-full rounded-xl border border-white/10 bg-slate-950/40 px-4 py-3.5 text-sm text-white focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-400/20 transition cursor-pointer">
                    <option value="" class="bg-slate-900 text-white">Loading countries...</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400" for="citySelect">
                    City / State
                </label>
                <select id="citySelect" required
                    class="w-full rounded-xl border border-white/10 bg-slate-950/40 px-4 py-3.5 text-sm text-white focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-400/20 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    <option value="" class="bg-slate-900 text-white">Select a country first</option>
                </select>
            </div>

            <button type="submit"
                class="w-full mt-2 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 py-3.5 font-semibold text-sm text-white shadow-lg shadow-sky-500/20 hover:from-sky-400 hover:to-indigo-500 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer">
                Get Forecast
            </button>
        </form>

        <div id="message" class="mt-6 text-center text-sm font-medium text-sky-400 animate-pulse"></div>

        <div id="result"
            class="mt-6 hidden rounded-2xl bg-gradient-to-b from-white/10 to-white/5 border border-white/10 p-6 shadow-inner">

            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <h2 id="resultCity" class="text-lg font-semibold tracking-wide text-white"></h2>
                <span
                    class="text-xs font-bold px-2.5 py-1 rounded-full bg-white/10 text-sky-300 uppercase tracking-wider">Live</span>
            </div>

            <div id="resultTemp"
                class="text-6xl font-extrabold text-center my-6 tracking-tighter bg-gradient-to-b from-white to-slate-300 bg-clip-text text-transparent">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/5 text-center text-sm">
                <div class="p-3 rounded-xl bg-white/5">
                    <span class="block text-xs text-slate-400 font-medium mb-1">Condition</span>
                    <p id="resultDesc" class="font-semibold text-white capitalize"></p>
                </div>
                <div class="p-3 rounded-xl bg-white/5">
                    <span class="block text-xs text-slate-400 font-medium mb-1">Wind Speed</span>
                    <p id="resultWind" class="font-semibold text-white"></p>
                </div>
            </div>
        </div>

    </main>

    <script src="./script.js"></script>
</body>

</html>
